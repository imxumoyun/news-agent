# RSS manbalar.
# weight — Curator uchun manba ishonchliligi (0.0-1.0). Birlamchi bloglar eng yuqori.
# Yangi manba qo'shgandan keyin: python -m news_agent sources-check

sources:
  # ---- Agregatorlar ----
  - name: Techmeme
    url: https://www.techmeme.com/feed.xml
    category: aggregator
    weight: 0.85
  - name: Hacker News (200+ ball)
    url: https://hnrss.org/frontpage?points=200
    category: aggregator
    weight: 0.8

  # ---- Birlamchi manbalar: AI kompaniyalari ----
  - name: OpenAI
    url: https://openai.com/news/rss.xml
    category: primary
    weight: 1.0
  # Anthropic'da ochiq RSS yo'q — Google News uning saytini indekslaydi.
  - name: Anthropic
    url: https://news.google.com/rss/search?q=when:2d+site:anthropic.com&hl=en-US&gl=US&ceid=US:en
